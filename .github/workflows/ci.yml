name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:

  # =========================================================================
  # JOB 1: CI — Run full test suite
  # Triggers on every push and every PR to main.
  # Blocks PR merge if any test fails.
  # =========================================================================

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov fastapi uvicorn httpx pydantic

      - name: Run full test suite with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov=creational_patterns \
            --cov=repositories \
            --cov=services \
            --cov=api \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # =========================================================================
  # JOB 2: CD — Build and upload release artifact
  # Only runs when code is merged (pushed) to main.
  # Depends on test job passing.
  # =========================================================================

  release:
    name: Build Release Artifact
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools fastapi uvicorn httpx pydantic

      - name: Create setup.py for packaging
        run: |
          cat > setup.py << 'EOF'
          from setuptools import setup, find_packages
          setup(
              name="student-assignment-tracker",
              version="1.0.0",
              packages=find_packages(),
              install_requires=[
                  "fastapi>=0.100.0",
                  "uvicorn>=0.20.0",
                  "pydantic>=2.0.0",
                  "httpx>=0.24.0",
              ],
              python_requires=">=3.8",
              description="A RESTful API for managing academic assignments, submissions, and grading.",
              author="Mongameli Shasha",
              url="https://github.com/219181527/student-assignment-tracker",
          )
          EOF

      - name: Build Python wheel
        run: python -m build --wheel --outdir dist/

      - name: List build artifacts
        run: ls -la dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-assignment-tracker-wheel
          path: dist/*.whl
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## Student Assignment Tracker v1.0.${{ github.run_number }}

            ### What's included
            - REST API with 25 endpoints (FastAPI)
            - Service layer: UserService, AssignmentService, SubmissionService
            - Repository layer with in-memory, filesystem, and database stubs
            - 265 tests passing

            ### Install
            ```bash
            pip install student_assignment_tracker-1.0.0-py3-none-any.whl
            uvicorn api.main:app --reload
            ```

            ### API Docs
            Once running, visit http://localhost:8000/docs
          files: dist/*.whl
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}